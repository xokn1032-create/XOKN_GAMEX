
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opal Star Spark — Robotic Eye 003</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #050711;
      color: #e9f5ff;
      font-family: system-ui, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    .hud {
      position: fixed;
      top: 24px;
      left: 25px;
      pointer-events: none;
    }

    .hud h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 4px;
      text-shadow: 0 0 15px #00d9ff;
    }

    .hud p {
      color: #8b9dbb;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .hint {
      position: fixed;
      bottom: 22px;
      width: 100%;
      text-align: center;
      color: #8292b7;
      font-size: 11px;
      letter-spacing: 2px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="scene"></div>

  <div class="hud">
    <h1>OPAL STAR SPARK</h1>
    <p>SPECIMEN 003 // ROBOTIC OPTICAL SENSOR</p>
  </div>

  <div class="hint">
    DRAG TO ROTATE · SCROLL TO ZOOM
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // ================================================
    // SCENE
    // ================================================

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050711);
    scene.fog = new THREE.FogExp2(0x050711, 0.025);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 0.7, 7);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;

    document.querySelector("#scene").appendChild(renderer.domElement);

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;
    controls.minDistance = 4;
    controls.maxDistance = 11;

    // ================================================
    // LIGHTING
    // ================================================

    scene.add(new THREE.AmbientLight(0x63718f, 1.5));

    const mainLight = new THREE.PointLight(0xffffff, 55, 20);
    mainLight.position.set(0, 3, 5);
    scene.add(mainLight);

    const rainbowLights = [];

    const lightColors = [
      0xff1744,
      0xff8c00,
      0xffff00,
      0x00ff88,
      0x00ccff,
      0x6845ff,
      0xff00cc
    ];

    lightColors.forEach((color, i) => {
      const angle = (i / lightColors.length) * Math.PI * 2;

      const light = new THREE.PointLight(color, 18, 9);
      light.position.set(
        Math.cos(angle) * 3,
        Math.sin(angle) * 2,
        2
      );

      scene.add(light);
      rainbowLights.push(light);
    });

    // ================================================
    // MAIN ASSEMBLY
    // ================================================

    const eye = new THREE.Group();
    scene.add(eye);

    const housing = new THREE.Group();
    eye.add(housing);

    // ================================================
    // MATERIALS
    // ================================================

    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x182239,
      metalness: 0.92,
      roughness: 0.25
    });

    const steel = new THREE.MeshStandardMaterial({
      color: 0x9aa9c8,
      metalness: 0.95,
      roughness: 0.2
    });

    const blackGlass = new THREE.MeshPhysicalMaterial({
      color: 0x10172d,
      metalness: 0.5,
      roughness: 0.08,
      clearcoat: 1
    });

    const rainbowGlow = new THREE.MeshBasicMaterial({
      color: 0xffffff
    });

    // ================================================
    // BACK PLATE
    // ================================================

    const backPlate = new THREE.Mesh(
      new THREE.CylinderGeometry(1.65, 1.8, 0.35, 12),
      darkMetal
    );

    backPlate.rotation.x = Math.PI / 2;
    backPlate.position.z = -0.4;
    housing.add(backPlate);

    // ================================================
    // OUTER RING
    // ================================================

    const outerRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.48, 0.18, 16, 96),
      steel
    );

    outerRing.position.z = 0.02;
    housing.add(outerRing);

    const innerRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.18, 0.095, 12, 96),
      darkMetal
    );

    innerRing.position.z = 0.13;
    housing.add(innerRing);

    // ================================================
    // LENS HOUSING
    // ================================================

    const lensHousing = new THREE.Mesh(
      new THREE.CylinderGeometry(1.12, 1.25, 0.3, 12),
      darkMetal
    );

    lensHousing.rotation.x = Math.PI / 2;
    lensHousing.position.z = 0.1;
    housing.add(lensHousing);

    const glassLens = new THREE.Mesh(
      new THREE.SphereGeometry(0.92, 64, 48),
      blackGlass
    );

    glassLens.scale.set(1, 1, 0.35);
    glassLens.position.z = 0.36;
    housing.add(glassLens);

    // ================================================
    // RAINBOW IRIS
    // ================================================

    const irisGroup = new THREE.Group();
    irisGroup.position.z = 0.53;
    housing.add(irisGroup);

    const irisRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.7, 0.055, 10, 96),
      rainbowGlow
    );

    irisGroup.add(irisRing);

    const innerIris = new THREE.Mesh(
      new THREE.TorusGeometry(0.48, 0.035, 8, 80),
      new THREE.MeshBasicMaterial({
        color: 0x00eaff
      })
    );

    irisGroup.add(innerIris);

    // ================================================
    // CENTRAL SENSOR
    // ================================================

    const sensor = new THREE.Mesh(
      new THREE.SphereGeometry(0.39, 48, 48),
      new THREE.MeshPhysicalMaterial({
        color: 0x8a63ff,
        metalness: 0.15,
        roughness: 0.08,
        clearcoat: 1,
        emissive: 0x4b00ff,
        emissiveIntensity: 2
      })
    );

    sensor.scale.set(1, 1, 0.45);
    sensor.position.z = 0.66;
    housing.add(sensor);

    const pupil = new THREE.Mesh(
      new THREE.SphereGeometry(0.17, 32, 32),
      new THREE.MeshBasicMaterial({
        color: 0xffffff
      })
    );

    pupil.scale.z = 0.3;
    pupil.position.z = 0.84;
    housing.add(pupil);

    // ================================================
    // MECHANICAL IRIS BLADES
    // ================================================

    const blades = [];

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;

      const blade = new THREE.Mesh(
        new THREE.BoxGeometry(0.13, 0.48, 0.07),
        steel
      );

      blade.position.set(
        Math.cos(angle) * 0.83,
        Math.sin(angle) * 0.83,
        0.55
      );

      blade.rotation.z = angle + 0.5;
      housing.add(blade);
      blades.push(blade);
    }

    // ================================================
    // RAINBOW CIRCUIT NODES
    // ================================================

    const nodes = [];

    for (let i = 0; i < 14; i++) {
      const angle = (i / 14) * Math.PI * 2;

      const node = new THREE.Mesh(
        new THREE.SphereGeometry(0.075, 16, 12),
        rainbowGlow.clone()
      );

      node.position.set(
        Math.cos(angle) * 1.49,
        Math.sin(angle) * 1.49,
        0.19
      );

      housing.add(node);
      nodes.push(node);
    }

    // ================================================
    // EXTERNAL ARMOR SEGMENTS
    // ================================================

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;

      const armor = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.42, 0.24),
        darkMetal
      );

      armor.position.set(
        Math.cos(angle) * 1.72,
        Math.sin(angle) * 1.72,
        -0.12
      );

      armor.rotation.z = angle;
      housing.add(armor);
    }

    // ================================================
    // BACKGROUND STARS
    // ================================================

    const starPositions = [];

    for (let i = 0; i < 1000; i++) {
      starPositions.push(
        (Math.random() - 0.5) * 40,
        (Math.random() - 0.5) * 30,
        (Math.random() - 0.5) * 30
      );
    }

    const starGeometry = new THREE.BufferGeometry();

    starGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(starPositions, 3)
    );

    const starField = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        color: 0xb8d5ff,
        size: 0.025,
        transparent: true,
        opacity: 0.8
      })
    );

    scene.add(starField);

    // ================================================
    // ANIMATION
    // ================================================

    const clock = new THREE.Clock();

    const color = new THREE.Color();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      // Mechanical rotation
      irisGroup.rotation.z = t * 0.65;
      innerIris.rotation.z = -t * 0.9;

      // Sensor pulse
      const pulse = 1 + Math.sin(t * 2.5) * 0.06;

      sensor.scale.set(
        pulse,
        pulse,
        0.45
      );

      // Rainbow color cycling
      const hue = (t * 0.12) % 1;

      color.setHSL(hue, 1, 0.6);

      rainbowGlow.color.copy(color);
      sensor.material.emissive.setHSL(
        (hue + 0.5) % 1,
        1,
        0.3
      );

      // Circuit node rainbow
      nodes.forEach((node, i) => {
        const nodeHue = (hue + i / nodes.length) % 1;
        node.material.color.setHSL(nodeHue, 1, 0.6);
      });

      // Blade movement
      blades.forEach((blade, i) => {
        blade.rotation.z =
          (i / blades.length) * Math.PI * 2 +
          Math.sin(t * 1.3) * 0.04;
      });

      // Rainbow illumination
      rainbowLights.forEach((light, i) => {
        const angle =
          (i / rainbowLights.length) * Math.PI * 2 +
          t * 0.3;

        light.position.x = Math.cos(angle) * 3;
        light.position.y = Math.sin(angle) * 2;
      });

      // Gentle assembly movement
      housing.rotation.y = Math.sin(t * 0.35) * 0.12;
      housing.rotation.x = Math.sin(t * 0.25) * 0.06;

      starField.rotation.y = t * 0.008;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // ================================================
    // RESIZE
    // ================================================

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    });
  </script>
</body>
</html>
