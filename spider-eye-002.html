
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opal Star Spark — Alien Crystal Eye</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #03030c;
      color: #e8eaff;
      font-family: system-ui, sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
    }

    .hud {
      position: fixed;
      top: 22px;
      left: 24px;
      pointer-events: none;
      text-shadow: 0 0 14px #8a5cff;
    }

    .hud h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: 4px;
      font-weight: 600;
    }

    .hud p {
      margin-top: 8px;
      color: #9e9fca;
      font-size: 11px;
      letter-spacing: 2px;
    }

    .hint {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #777baf;
      font-size: 11px;
      letter-spacing: 2px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="scene"></div>

  <div class="hud">
    <h1>OPAL STAR SPARK</h1>
    <p>SPECIMEN 002 // ALIEN CRYSTAL</p>
  </div>

  <div class="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // --------------------------------------------------
    // SCENE
    // --------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03030c);
    scene.fog = new THREE.FogExp2(0x03030c, 0.035);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 1.2, 7);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;

    document.querySelector("#scene").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = false;
    controls.minDistance = 4;
    controls.maxDistance = 11;

    // --------------------------------------------------
    // LIGHTS
    // --------------------------------------------------

    scene.add(new THREE.AmbientLight(0x35305f, 1.4));

    function pointLight(color, intensity, position) {
      const light = new THREE.PointLight(color, intensity, 15);
      light.position.set(...position);
      scene.add(light);
      return light;
    }

    const cyanLight = pointLight(0x00f5ff, 55, [-3, 2, 3]);
    const magentaLight = pointLight(0xff16c8, 65, [3, -1, 2]);
    const violetLight = pointLight(0x743cff, 45, [0, 3, -3]);

    // --------------------------------------------------
    // MAIN EYE GROUP
    // --------------------------------------------------

    const eye = new THREE.Group();
    scene.add(eye);

    const crystalGroup = new THREE.Group();
    eye.add(crystalGroup);

    // --------------------------------------------------
    // DARK ALIEN CORE
    // --------------------------------------------------

    const coreGeometry = new THREE.IcosahedronGeometry(1.05, 1);

    const coreMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x101329,
      metalness: 0.8,
      roughness: 0.22,
      clearcoat: 1,
      clearcoatRoughness: 0.12,
      flatShading: true
    });

    const core = new THREE.Mesh(coreGeometry, coreMaterial);
    crystalGroup.add(core);

    // --------------------------------------------------
    // OUTER CRYSTAL
    // --------------------------------------------------

    const crystalGeometry = new THREE.IcosahedronGeometry(1.42, 0);

    const crystalMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x9b8cff,
      metalness: 0.25,
      roughness: 0.12,
      transmission: 0.25,
      thickness: 1.4,
      clearcoat: 1,
      clearcoatRoughness: 0.04,
      emissive: 0x351078,
      emissiveIntensity: 0.65,
      flatShading: true,
      transparent: true,
      opacity: 0.82
    });

    const outerCrystal = new THREE.Mesh(
      crystalGeometry,
      crystalMaterial
    );

    outerCrystal.scale.set(1, 0.88, 0.55);
    crystalGroup.add(outerCrystal);

    // --------------------------------------------------
    // INNER ENERGY CORE
    // --------------------------------------------------

    const energyGeometry = new THREE.IcosahedronGeometry(0.62, 2);

    const energyMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xf3dfff,
      metalness: 0.15,
      roughness: 0.08,
      emissive: 0xb000ff,
      emissiveIntensity: 2.2,
      transmission: 0.15,
      clearcoat: 1
    });

    const energyCore = new THREE.Mesh(
      energyGeometry,
      energyMaterial
    );

    energyCore.position.z = 0.48;
    crystalGroup.add(energyCore);

    // --------------------------------------------------
    // CYAN PUPIL
    // --------------------------------------------------

    const pupilGeometry = new THREE.OctahedronGeometry(0.24, 1);

    const pupilMaterial = new THREE.MeshBasicMaterial({
      color: 0x00ffff
    });

    const pupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
    pupil.position.z = 1.05;
    crystalGroup.add(pupil);

    // Small inner iris ring
    const irisGeometry = new THREE.TorusGeometry(
      0.38,
      0.035,
      8,
      64
    );

    const irisMaterial = new THREE.MeshBasicMaterial({
      color: 0xff32d2
    });

    const iris = new THREE.Mesh(irisGeometry, irisMaterial);
    iris.position.z = 0.91;
    crystalGroup.add(iris);

    // --------------------------------------------------
    // CRYSTAL FACETS / SHARDS
    // --------------------------------------------------

    const shardMaterial = new THREE.MeshStandardMaterial({
      color: 0x28eaff,
      metalness: 0.75,
      roughness: 0.16,
      emissive: 0x087a9c,
      emissiveIntensity: 1.1,
      flatShading: true
    });

    const shardMaterial2 = new THREE.MeshStandardMaterial({
      color: 0xff40d6,
      metalness: 0.65,
      roughness: 0.2,
      emissive: 0x8a087c,
      emissiveIntensity: 1.2,
      flatShading: true
    });

    const shards = [];

    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;

      const geometry = new THREE.OctahedronGeometry(
        0.24 + Math.random() * 0.15,
        0
      );

      const material = i % 2 === 0
        ? shardMaterial
        : shardMaterial2;

      const shard = new THREE.Mesh(geometry, material);

      shard.position.set(
        Math.cos(angle) * 1.12,
        Math.sin(angle) * 0.85,
        0.2 + Math.random() * 0.25
      );

      shard.scale.set(0.65, 1.6, 0.55);
      shard.rotation.z = angle;

      crystalGroup.add(shard);
      shards.push(shard);
    }

    // --------------------------------------------------
    // ALIEN MECHANICAL SUPPORTS
    // --------------------------------------------------

    const supportMaterial = new THREE.MeshStandardMaterial({
      color: 0x242b4b,
      metalness: 0.9,
      roughness: 0.28
    });

    const supportGlow = new THREE.MeshBasicMaterial({
      color: 0x00dfff
    });

    const supports = [];

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;

      const support = new THREE.Group();

      support.position.set(
        Math.cos(angle) * 1.05,
        Math.sin(angle) * 0.82,
        -0.15
      );

      support.rotation.z = angle;

      const arm = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, 0.72, 0.18),
        supportMaterial
      );

      arm.position.y = 0.3;
      arm.rotation.z = -0.28;
      support.add(arm);

      const node = new THREE.Mesh(
        new THREE.OctahedronGeometry(0.12, 0),
        supportGlow
      );

      node.position.y = 0.65;
      support.add(node);

      crystalGroup.add(support);
      supports.push(support);
    }

    // --------------------------------------------------
    // BACKGROUND STARS
    // --------------------------------------------------

    const starGeometry = new THREE.BufferGeometry();
    const starPositions = [];

    for (let i = 0; i < 900; i++) {
      starPositions.push(
        (Math.random() - 0.5) * 35,
        (Math.random() - 0.5) * 25,
        (Math.random() - 0.5) * 25
      );
    }

    starGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(starPositions, 3)
    );

    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        color: 0xb4c9ff,
        size: 0.025,
        transparent: true,
        opacity: 0.8
      })
    );

    scene.add(stars);

    // --------------------------------------------------
    // ANIMATION
    // --------------------------------------------------

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      // Slow alien crystal movement
      crystalGroup.rotation.y = Math.sin(time * 0.35) * 0.15;
      crystalGroup.rotation.x = Math.sin(time * 0.25) * 0.08;

      // Energy pulse
      const pulse = 1 + Math.sin(time * 2.1) * 0.055;

      energyCore.scale.setScalar(pulse);
      energyMaterial.emissiveIntensity =
        1.5 + Math.sin(time * 2.1) * 0.8;

      // Pupil movement
      pupil.rotation.y = time * 0.5;
      pupil.rotation.x = Math.sin(time * 0.8) * 0.2;

      // Iris rotation
      iris.rotation.z = time * 0.25;

      // Shard motion
      shards.forEach((shard, index) => {
        shard.rotation.x = time * 0.2 + index;
      });

      // Lighting pulse
      cyanLight.intensity = 45 + Math.sin(time * 1.6) * 12;
      magentaLight.intensity = 55 + Math.cos(time * 1.3) * 15;

      stars.rotation.y = time * 0.008;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --------------------------------------------------
    // RESIZE
    // --------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );

      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
    });
  </script>
</body>
</html>
