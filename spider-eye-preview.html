
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opal Star Spark — Spider Eye 001</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #070914;
      color: #e8eaff;
      font-family: system-ui, sans-serif;
    }

    canvas { display: block; }

    #panel {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 16px 20px;
      border: 1px solid #555a91;
      border-radius: 12px;
      background: #10152add;
      backdrop-filter: blur(12px);
      pointer-events: none;
    }

    #panel h1 {
      margin: 0 0 6px;
      font-size: 16px;
      letter-spacing: 2px;
    }

    #panel p {
      margin: 0;
      color: #aeb8e8;
      font-size: 12px;
    }

    #hint {
      position: fixed;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #9ca8d4;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="panel">
    <h1>OPAL EYE 001</h1>
    <p>Organic / Cybernetic / Cyan-Violet</p>
  </div>

  <div id="hint">
    Drag to rotate · Scroll to zoom
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // ----------------------------------
    // SCENE
    // ----------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070914);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 0.4, 7);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;
    controls.minDistance = 3;
    controls.maxDistance = 10;

    // ----------------------------------
    // LIGHTING
    // ----------------------------------

    scene.add(new THREE.AmbientLight(0x6677aa, 1.3));

    const cyanLight = new THREE.PointLight(0x00eaff, 35, 12);
    cyanLight.position.set(-3, 2, 3);
    scene.add(cyanLight);

    const violetLight = new THREE.PointLight(0x8c45ff, 40, 12);
    violetLight.position.set(3, -1, 2);
    scene.add(violetLight);

    const backLight = new THREE.PointLight(0x3155ff, 45, 12);
    backLight.position.set(0, 2, -3);
    scene.add(backLight);

    // ----------------------------------
    // EYE GROUP
    // ----------------------------------

    const eye = new THREE.Group();
    scene.add(eye);

    // Dark organic shell
    const shellMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x111a32,
      metalness: 0.78,
      roughness: 0.24,
      clearcoat: 1,
      clearcoatRoughness: 0.12
    });

    const shell = new THREE.Mesh(
      new THREE.SphereGeometry(1.35, 64, 48),
      shellMaterial
    );

    shell.scale.set(1.2, 0.88, 0.55);
    eye.add(shell);

    // ----------------------------------
    // METALLIC EYE RINGS
    // ----------------------------------

    const ringMaterial = new THREE.MeshStandardMaterial({
      color: 0x536487,
      metalness: 0.9,
      roughness: 0.2
    });

    const outerRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.94, 0.105, 16, 96),
      ringMaterial
    );

    outerRing.position.z = 0.58;
    outerRing.scale.set(1.15, 0.88, 1);
    eye.add(outerRing);

    const innerRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.79, 0.035, 12, 96),
      new THREE.MeshStandardMaterial({
        color: 0x00cde9,
        metalness: 0.7,
        roughness: 0.25,
        emissive: 0x004b70
      })
    );

    innerRing.position.z = 0.69;
    innerRing.scale.set(1.15, 0.88, 1);
    eye.add(innerRing);

    // ----------------------------------
    // OPAL LENS
    // ----------------------------------

    const opalMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x9d8aff,
      metalness: 0.22,
      roughness: 0.12,
      transmission: 0.12,
      thickness: 1.5,
      clearcoat: 1,
      clearcoatRoughness: 0.05,
      emissive: 0x291b91,
      emissiveIntensity: 0.65
    });

    const lens = new THREE.Mesh(
      new THREE.SphereGeometry(0.76, 64, 64),
      opalMaterial
    );

    lens.scale.set(1.1, 0.9, 0.48);
    lens.position.z = 0.65;
    eye.add(lens);

    // Inner luminous pupil
    const pupilMaterial = new THREE.MeshStandardMaterial({
      color: 0x111b57,
      metalness: 0.45,
      roughness: 0.16,
      emissive: 0x00cfff,
      emissiveIntensity: 1.8
    });

    const pupil = new THREE.Mesh(
      new THREE.SphereGeometry(0.29, 48, 48),
      pupilMaterial
    );

    pupil.scale.set(1, 1, 0.45);
    pupil.position.set(0, 0, 1.01);
    eye.add(pupil);

    // Small central highlight
    const highlight = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );

    highlight.position.set(-0.12, 0.13, 1.15);
    eye.add(highlight);

    // ----------------------------------
    // CRYSTALLINE DETAILS
    // ----------------------------------

    const crystalMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x9e75ff,
      metalness: 0.35,
      roughness: 0.15,
      transmission: 0.2,
      emissive: 0x4c16bb,
      emissiveIntensity: 0.7
    });

    const crystalGeometry = new THREE.OctahedronGeometry(0.12, 0);

    const crystalPositions = [
      [-1.05, 0.45, 0.35],
      [1.05, 0.45, 0.35],
      [-1.08, -0.43, 0.35],
      [1.08, -0.43, 0.35],
      [0, 0.92, 0.3],
      [0, -0.92, 0.3]
    ];

    const crystals = [];

    for (const position of crystalPositions) {
      const crystal = new THREE.Mesh(
        crystalGeometry,
        crystalMaterial
      );

      crystal.position.set(...position);
      crystal.scale.set(1, 1.4, 0.8);

      eye.add(crystal);
      crystals.push(crystal);
    }

    // ----------------------------------
    // SMALL MECHANICAL SUPPORTS
    // ----------------------------------

    const supportMaterial = new THREE.MeshStandardMaterial({
      color: 0x263b5e,
      metalness: 0.9,
      roughness: 0.28
    });

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;

      const support = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.34, 0.16),
        supportMaterial
      );

      support.position.set(
        Math.cos(angle) * 1.17,
        Math.sin(angle) * 0.85,
        0.48
      );

      support.rotation.z = angle;
      eye.add(support);
    }

    // ----------------------------------
    // BACKGROUND PARTICLES
    // ----------------------------------

    const particleGeometry = new THREE.BufferGeometry();
    const particleCount = 500;
    const particlePositions = [];

    for (let i = 0; i < particleCount; i++) {
      particlePositions.push(
        (Math.random() - 0.5) * 18,
        (Math.random() - 0.5) * 12,
        -3 - Math.random() * 8
      );
    }

    particleGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(particlePositions, 3)
    );

    const particles = new THREE.Points(
      particleGeometry,
      new THREE.PointsMaterial({
        color: 0x7289ff,
        size: 0.025,
        transparent: true,
        opacity: 0.75
      })
    );

    scene.add(particles);

    // ----------------------------------
    // ANIMATION
    // ----------------------------------

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      // Gentle breathing motion
      const pulse = 1 + Math.sin(time * 2) * 0.018;
      lens.scale.set(1.1 * pulse, 0.9 * pulse, 0.48);

      // Subtle living glow
      pupilMaterial.emissiveIntensity =
        1.5 + Math.sin(time * 2.4) * 0.5;

      opalMaterial.emissiveIntensity =
        0.55 + Math.sin(time * 1.5) * 0.2;

      crystals.forEach((crystal, index) => {
        crystal.rotation.y = time * 0.35 + index;
        crystal.rotation.x = time * 0.2;
      });

      particles.rotation.y = time * 0.008;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // ----------------------------------
    // RESIZE
    // ----------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>
</body>
</html>
